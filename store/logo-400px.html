<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><style>
body { margin:0; display:flex; justify-content:center; align-items:center; height:100vh; background:#0d1117; }
.logo { width:400px; height:400px; border-radius:24px; background:linear-gradient(135deg,#0a1628,#0d1f3c); display:flex; flex-direction:column; align-items:center; justify-content:center; }
.icon { font-size:120px; line-height:1; }
.brand { font-size:72px; font-weight:900; background:linear-gradient(135deg,#00D68F,#0088ff); -webkit-background-clip:text; -webkit-text-fill-color:transparent; font-family:sans-serif; margin:20px 0 0 0; }
</style></head>
<body>
<div class="logo">
  <div class="icon">🏋️</div>
  <div class="brand">IronLog</div>
</div>
</body>
</html>
