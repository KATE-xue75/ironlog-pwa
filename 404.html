<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>404 — Page Not Found | IronLog</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #fafdf8; color: #1a202c; min-height: 100vh;
    display: flex; align-items: center; justify-content: center; text-align: center; padding: 24px;
  }
  .card { max-width: 460px; }
  .code {
    font-size: 72px; font-weight: 800; line-height: 1;
    background: linear-gradient(135deg, #00D68F, #0088ff);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    margin-bottom: 16px;
  }
  h1 { font-size: 22px; font-weight: 700; margin-bottom: 10px; }
  p { font-size: 15px; color: #4a5568; line-height: 1.6; margin-bottom: 24px; }
  a {
    display: inline-block; padding: 12px 26px; border-radius: 8px; font-size: 15px;
    font-weight: 600; text-decoration: none; color: #fff; margin: 0 4px;
    background: linear-gradient(135deg, #00D68F, #0088ff);
  }
  a.ghost { background: #e2e8f0; color: #1a202c; }
</style>
</head>
<body>
<div class="card">
  <div class="code">404</div>
  <h1>This page doesn't exist</h1>
  <p>No login. No ads. No missing pages either — looks like this one never made it to the gym.</p>
  <a href="/">🏋️ Go Home</a>
  <a class="ghost" href="/exercises/">Browse Exercises</a>
</div>
</body>
</html>
