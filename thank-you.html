<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Unlocking Your Program...</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0f1117;
      color: #e1e4e8;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; text-align: center; padding: 20px;
    }
    .card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 48px 32px;
      max-width: 420px;
    }
    .icon { font-size: 48px; margin-bottom: 16px; }
    h1 { font-size: 22px; font-weight: 600; margin-bottom: 8px; }
    p { color: #8b949e; font-size: 14px; line-height: 1.6; margin-bottom: 20px; }
    .spinner {
      display: inline-block; width: 24px; height: 24px;
      border: 3px solid #30363d; border-top-color: #58a6ff;
      border-radius: 50%; animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .note { font-size: 12px; color: #484f58; margin-top: 16px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">🔓</div>
    <h1 id="title">Unlocking Your Program...</h1>
    <p id="msg">You're all set! Taking you back to IronLog now.</p>
    <div class="spinner"></div>
    <p class="note">Your purchase is stored locally on your device.<br>No account needed — ever.</p>
  </div>

  <script>
    (function() {
      var params = new URLSearchParams(window.location.search);
      var product = params.get('product');

      var keyMap = {
        'bodyweight-mastery': 'unlocked_bodyweight_mastery',
        'desk-warrior':       'unlocked_desk_warrior',
        'travel-fit':         'unlocked_travel_fit'
      };

      var labelMap = {
        'bodyweight-mastery': 'Bodyweight Mastery',
        'desk-warrior':       'Desk Warrior',
        'travel-fit':         'Travel Fit'
      };

      var storageKey = keyMap[product];
      var label = labelMap[product] || 'Your Program';

      if (storageKey) {
        localStorage.setItem(storageKey, 'true');
        localStorage.setItem('unlock_ts_' + product, Date.now().toString());
        document.getElementById('title').textContent = '✅ ' + label + ' Unlocked!';
      } else {
        document.getElementById('title').textContent = '✅ Purchase Complete!';
        document.getElementById('msg').textContent = 'No product specified, but your purchase is safe. Taking you back to IronLog.';
      }

      setTimeout(function() {
        window.location.href = '/';
      }, 2500);
    })();
  </script>
</body>
</html>
